name: Scan rooms

on:
  schedule:
    # Every 30 minutes, offset from the busiest minute of the hour (UTC).
    - cron: '7,37 * * * *'
  workflow_dispatch:

permissions:
  contents: read

# Keep scans from racing when updating the seen-room history.
concurrency:
  group: room-scanner-${{ github.ref }}
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Restore seen-room history
        id: state
        uses: actions/cache/restore@v5
        with:
          path: |
            data/scanner.sqlite3
            data/wgzimmer-geocodes.json
          key: room-scanner-state-v1-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            room-scanner-state-v1-${{ runner.os }}-${{ github.ref_name }}-

      - name: Scan rooms once
        id: scan
        shell: bash
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          NTFY_SERVER: ${{ vars.NTFY_SERVER }}
        run: |
          # Restore only state; never present a previous run's exports as fresh.
          rm -f data/results.json data/results.csv
          set +e
          python -u main.py scan --config config.example.json --output-dir data --new-only
          scan_status=$?
          set -e
          echo "exit_code=$scan_status" >> "$GITHUB_OUTPUT"
          if [ "$scan_status" -eq 2 ]; then
            echo "::warning::Scan is incomplete. See results.json for source errors or missing locations."
          elif [ "$scan_status" -eq 3 ]; then
            echo "::error::ntfy delivery failed. Results and delivery history will be saved for retry on the next scan."
            exit 3
          else
            exit "$scan_status"
          fi

      - name: Save seen-room history
        if: ${{ always() && (steps.scan.outputs.exit_code == '0' || steps.scan.outputs.exit_code == '2' || steps.scan.outputs.exit_code == '3') }}
        uses: actions/cache/save@v5
        with:
          path: |
            data/scanner.sqlite3
            data/wgzimmer-geocodes.json
          key: ${{ steps.state.outputs.cache-primary-key }}

      - name: Upload current results
        if: ${{ always() && (steps.scan.outputs.exit_code == '0' || steps.scan.outputs.exit_code == '2' || steps.scan.outputs.exit_code == '3') }}
        uses: actions/upload-artifact@v6
        with:
          name: room-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            data/results.json
            data/results.csv
          if-no-files-found: error
          retention-days: 7

      - name: Write run summary
        if: ${{ always() && steps.scan.outputs.exit_code != '' }}
        shell: bash
        run: |
          python - <<'PY'
          import html
          import json
          import os
          from pathlib import Path

          result_path = Path("data/results.json")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              if not result_path.exists():
                  summary.write("Scan failed without fresh results. See the scan step's logs.\n")
              else:
                  report = json.loads(result_path.read_text(encoding="utf-8"))
                  status = "Complete" if report["complete"] else "PARTIAL — check source status below"
                  summary.write(f"{status}: {len(report['matches'])} matching rooms, {report['new_count']} new.\n\n")
                  summary.write(f"Scanned at {html.escape(report['scanned_at'])} (UTC).\n\n")
                  for source, source_status in report["sources"].items():
                      details = source_status.get("error") or (
                          "complete" if source_status["complete"] else "incomplete; see results.json")
                      summary.write(f"<p>{html.escape(source)}: {html.escape(details)}</p>\n")
                  notifications = report.get("notifications", {})
                  if notifications.get("enabled"):
                      summary.write(f"\nntfy: {notifications['sent_count']} sent; {notifications['failed_count']} awaiting delivery.\n\n")
                  else:
                      summary.write("\nntfy disabled: set the NTFY_TOPIC repository secret to enable alerts.\n\n")
                  summary.write("\nNew rooms:\n\n<ul>\n")
                  for room in report["matches"]:
                      if room["is_new"]:
                          preferred = "[PREFERRED] " if room["preferred_address_match"] else ""
                          summary.write(
                              f'<li>{preferred}<a href="{html.escape(room["url"], quote=True)}">'
                              f'{html.escape(room["title"])}</a> — CHF {room["price_chf"]:g}/month; '
                              f'{html.escape(room["address"])}</li>\n')
                  summary.write("</ul>\n\nDownload the results artifact for all current matches.\n")
          PY
